name: Daily IBKR data update

on:
  schedule:
    # Every day at 22:30 UTC (after US market close)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-ibkr-update.yml"
      - "scripts/update-ibkr-snapshot.js"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest data from IBKR Flex Web Service
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: node scripts/update-ibkr-snapshot.js
      - name: Commit and push if data changed
        run: |
          git config user.name "ibkr-bot"
          git config user.email "actions@github.com"
          git add lib/ibkr-snapshot.json public/data/executions-history.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Daily IBKR data update ($(date -u +%Y-%m-%d))"
          pushed=""
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && pushed=1 && break
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          if [ -z "$pushed" ]; then
            echo "::error::Failed to push after retries"
            exit 1
          fi
          # Keep main in sync so Vercel/main always serves fresh data.
          # Fast-forward only: if main has diverged, warn instead of clobbering it.
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              git push origin "HEAD:main" || echo "::warning::Could not push data to main"
            else
              echo "::warning::main has diverged from $GITHUB_REF_NAME — sync manually"
            fi
          fi
